<div class="page-header">
  <h1>Specialisations</h1>
  @if (!editing()) {
    <button mat-flat-button color="primary" type="button" (click)="beginCreate()">
      <mat-icon>add</mat-icon>
      New specialisation
    </button>
  }
</div>

@if (editing()) {
  <form [formGroup]="form" (ngSubmit)="save()" class="edit-form">
    <mat-form-field appearance="outline">
      <mat-label>Specialisation name</mat-label>
      <input matInput formControlName="name" />
      @if (form.controls.name.hasError('required')) {
        <mat-error>Name is required.</mat-error>
      }
    </mat-form-field>
    <div class="form-actions">
      <button mat-button type="button" (click)="cancelEdit()">Cancel</button>
      <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
        {{ editingId() ? 'Save changes' : 'Create' }}
      </button>
    </div>
  </form>
}

@if (loading()) {
  <div class="loading"><mat-spinner diameter="36" /></div>
} @else {
  <table mat-table [dataSource]="specialisations()" class="full-width mat-elevation-z1">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let item">{{ item.name }}</td>
    </ng-container>
    <ng-container matColumnDef="doctors">
      <th mat-header-cell *matHeaderCellDef>Doctors</th>
      <td mat-cell *matCellDef="let item">{{ item.doctors?.length ?? 0 }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let item">
        <button
          mat-icon-button
          type="button"
          (click)="beginEdit(item)"
          aria-label="Edit specialisation"
        >
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          type="button"
          (click)="remove(item)"
          aria-label="Delete specialisation"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
