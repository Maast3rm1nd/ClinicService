<div class="page-header">
  <h1>Insurance providers</h1>
  @if (auth.isAdministrator()) {
    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      New provider
    </button>
  }
</div>

@if (loading()) {
  <div class="loading">
    <mat-spinner diameter="36" />
  </div>
} @else {
  <table mat-table [dataSource]="providers()" class="mat-elevation-z1 full-width">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let provider">{{ provider.name }}</td>
    </ng-container>

    <ng-container matColumnDef="license">
      <th mat-header-cell *matHeaderCellDef>License</th>
      <td mat-cell *matCellDef="let provider">{{ provider.licenseNumber }}</td>
    </ng-container>

    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef>Phone</th>
      <td mat-cell *matCellDef="let provider">{{ provider.phoneNumber || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let provider">
        @if (auth.isAdministrator()) {
          <button mat-icon-button (click)="edit(provider)" aria-label="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="remove(provider)" aria-label="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
