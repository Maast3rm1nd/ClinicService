<div class="page-header">
  <h1>Policies</h1>
  @if (auth.isAdministrator()) {
    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      New policy
    </button>
  }
</div>

@if (loading()) {
  <div class="loading">
    <mat-spinner diameter="36" />
  </div>
} @else {
  <table mat-table [dataSource]="policies()" class="mat-elevation-z1 full-width">
    <ng-container matColumnDef="number">
      <th mat-header-cell *matHeaderCellDef>Policy number</th>
      <td mat-cell *matCellDef="let policy">{{ policy.medicalPolicyNumber }}</td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let policy">
        {{ policyTypeLabel(policy) }}
      </td>
    </ng-container>

    <ng-container matColumnDef="provider">
      <th mat-header-cell *matHeaderCellDef>Insurance provider</th>
      <td mat-cell *matCellDef="let policy">{{ providerName(policy) }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let policy">{{ policy.description || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let policy">
        @if (auth.isAdministrator()) {
          <button mat-icon-button (click)="edit(policy)" aria-label="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="remove(policy)" aria-label="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
