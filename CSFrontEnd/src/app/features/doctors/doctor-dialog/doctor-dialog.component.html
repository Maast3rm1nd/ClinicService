<h2 mat-dialog-title>Edit doctor</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="dialog-content">
    <mat-form-field appearance="outline">
      <mat-label>Full name</mat-label>
      <input matInput formControlName="fullName" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Short name</mat-label>
      <input matInput formControlName="shortName" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Login</mat-label>
      <input matInput formControlName="login" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Specialisations</mat-label>
      <mat-select formControlName="specialisations" multiple>
        @for (item of data.specialisations; track item.id) {
          <mat-option [value]="item.entityId">{{ item.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Work status</mat-label>
      <mat-select formControlName="employeeWorkStatus">
        @for (status of workStatuses; track status) {
          <mat-option [value]="status">{{ workStatusLabels[status] }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    @if (errorMessage()) {
      <p class="dialog-error">{{ errorMessage() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="saving()">Save</button>
  </mat-dialog-actions>
</form>
