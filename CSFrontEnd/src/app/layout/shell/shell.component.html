<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="shell__nav">
    <div class="shell__brand">
      <mat-icon>local_hospital</mat-icon>
      <span>Clinic Service</span>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon matListItemIcon>calendar_month</mat-icon>
        <span matListItemTitle>Schedule</span>
      </a>
      <a mat-list-item routerLink="/doctors" routerLinkActive="active">
        <mat-icon matListItemIcon>stethoscope</mat-icon>
        <span matListItemTitle>Doctors</span>
      </a>
      <a mat-list-item routerLink="/policies" routerLinkActive="active">
        <mat-icon matListItemIcon>badge</mat-icon>
        <span matListItemTitle>Policies</span>
      </a>
      <a mat-list-item routerLink="/insurance-providers" routerLinkActive="active">
        <mat-icon matListItemIcon>domain</mat-icon>
        <span matListItemTitle>Insurance providers</span>
      </a>
      @if (auth.isAdministrator()) {
        <a mat-list-item routerLink="/register" routerLinkActive="active">
          <mat-icon matListItemIcon>person_add</mat-icon>
          <span matListItemTitle>New user</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="shell__toolbar">
      <span class="shell__spacer"></span>
      <span class="shell__user">{{ auth.currentUser()?.login }} · {{ auth.currentUser()?.role }}</span>
      <button mat-icon-button (click)="logout()" aria-label="Log out" title="Log out">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>
    <main class="shell__content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
